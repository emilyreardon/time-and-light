<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden Lineage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #05080f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      color: rgba(255,255,255,0.7);
      user-select: none;
    }

    #gif-wrap {
      position: relative;
      width: min(85vw, 85vh);
      aspect-ratio: 1;
    }

    #gif-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #gif-img.loaded { opacity: 1; }

    #name {
      margin-top: 1.2rem;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: lowercase;
      min-height: 1.4em;
    }

    #hint {
      margin-top: 2.5rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>

  <div id="gif-wrap">
    <img id="gif-img" src="" alt="">
  </div>
  <div id="name"></div>
  <div id="hint">tap anywhere to reveal</div>

  <script>
    const all = [
      { name: 'alice',   src: 'alice.gif' },
      { name: 'gail',    src: 'gail_1.gif' },
      { name: 'gail',    src: 'gail_2.gif' },
      { name: 'maureen', src: 'maureen_1.gif' },
      { name: 'maureen', src: 'maureen_2.gif' },
      { name: 'emily',   src: 'emily_1.gif' },
      { name: 'emily',   src: 'emily_2.gif' },
      { name: 'emily',   src: 'emily_3.gif' },
      { name: 'johanna', src: 'johanna_1.gif' },
      { name: 'johanna', src: 'johanna_2.gif' },
      { name: 'johanna', src: 'johanna_3.gif' },
    ];

    const img  = document.getElementById('gif-img');
    const name = document.getElementById('name');
    const hint = document.getElementById('hint');
    let last = -1;

    function next() {
      let idx;
      do { idx = Math.floor(Math.random() * all.length); } while (idx === last && all.length > 1);
      last = idx;
      const entry = all[idx];
      img.classList.remove('loaded');
      img.onload = () => img.classList.add('loaded');
      img.src = entry.src;
      name.textContent = entry.name;
      hint.textContent = 'tap to see another';
    }

    document.body.addEventListener('click', next);
    next();
  </script>

</body>
</html>
