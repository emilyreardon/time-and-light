<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Time and Light</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: black;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    /* Live camera feed fills the screen */
    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #camera.ready { opacity: 1; }

    /* Dark scrim — lightens once camera is ready */
    #scrim {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.55);
      transition: background 1s ease;
      z-index: 1;
    }
    #scrim.dim { background: rgba(5, 8, 15, 0.25); }

    /* Tap prompt */
    #prompt {
      position: fixed;
      bottom: 2.5rem;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      z-index: 10;
      transition: color 0.6s, opacity 0.5s;
      color: rgba(255,255,255,0.25);
    }
    #prompt.detected { color: rgba(255,255,255,0.7); }
    #prompt.hidden { opacity: 0; pointer-events: none; }

    /* GIF overlay */
    #gif-wrap {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 15, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #gif-wrap.visible {
      opacity: 1;
      pointer-events: all;
    }

    #gif-img {
      max-width: 88vw;
      max-height: 78vh;
      display: block;
      border-radius: 2px;
    }

    #gif-name {
      margin-top: 0.9rem;
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: none;
    }

    #gif-dismiss {
      margin-top: 1.5rem;
      color: rgba(255,255,255,0.25);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
    }

    /* No-camera fallback */
    #nocamera {
      display: none;
      position: fixed;
      inset: 0;
      background: #05080f;
      z-index: 2;
    }
  </style>
</head>
<body>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="sample" style="display:none" width="64" height="64"></canvas>
  <div id="scrim"></div>
  <div id="prompt">point at the tiles</div>

  <div id="gif-wrap">
    <img id="gif-img" src="" alt="">
    <div id="gif-name"></div>
    <div id="gif-dismiss">tap to close</div>
  </div>

  <div id="nocamera"></div>

  <script>
    const gifs = [
      { name: 'Alice',   src: 'alice.gif' },
      { name: 'Gail',    src: 'gail_1.gif' },
      { name: 'Gail',    src: 'gail_2.gif' },
      { name: 'Maureen', src: 'maureen_1.gif' },
      { name: 'Maureen', src: 'maureen_2.gif' },
      { name: 'Emily',   src: 'emily_1.gif' },
      { name: 'Emily',   src: 'emily_2.gif' },
      { name: 'Emily',   src: 'emily_3.gif' },
      { name: 'Johanna', src: 'johanna_1.gif' },
      { name: 'Johanna', src: 'johanna_2.gif' },
      { name: 'Johanna', src: 'johanna_3.gif' },
    ];

    const video    = document.getElementById('camera');
    const scrim    = document.getElementById('scrim');
    const prompt   = document.getElementById('prompt');
    const gifWrap  = document.getElementById('gif-wrap');
    const gifImg   = document.getElementById('gif-img');
    const gifName  = document.getElementById('gif-name');

    const canvas  = document.getElementById('sample');
    const ctx     = canvas.getContext('2d', { willReadFrequently: true });

    let last = -1;
    let overlayOpen = false;
    let tilesDetected = false;

    // Detect cyanotype tile wall: significant blue distributed across the whole frame
    // (a single paper or one tile concentrates blue in one area; a wall fills every zone)
    function detectTiles() {
      if (!video.videoWidth) return false;
      ctx.drawImage(video, 0, 0, 64, 64);
      const data = ctx.getImageData(0, 0, 64, 64).data;

      // 3×3 grid of zones — count cyanotype blue pixels in each
      const zones = new Array(9).fill(0);
      const zoneSize = new Array(9).fill(0);
      let totalCyan = 0;

      for (let y = 0; y < 64; y++) {
        for (let x = 0; x < 64; x++) {
          const i = (y * 64 + x) * 4;
          const r = data[i], g = data[i+1], b = data[i+2];
          const z = Math.floor(y / 22) * 3 + Math.floor(x / 22); // zone 0-8
          if (z > 8) continue;
          zoneSize[z]++;
          // Loosened upper bound for screen/projector (brighter blues than physical tiles)
          if (b > r + 15 && b > g + 8 && b > 60 && b < 240 && r < 180) {
            zones[z]++;
            totalCyan++;
          }
        }
      }

      // Overall blue must be substantial (15% covers both physical tiles and screen)
      if (totalCyan / (64 * 64) < 0.15) return false;

      // Blue must appear in at least 6 of 9 zones
      // (8 for physical wall filling frame; 6 for monitor/projection which may not fill edges)
      const zonesWithBlue = zones.filter((c, i) => c / (zoneSize[i] || 1) > 0.10).length;
      return zonesWithBlue >= 6;
    }

    function checkFrame() {
      if (overlayOpen) return;
      const seen = detectTiles();
      if (seen !== tilesDetected) {
        tilesDetected = seen;
        if (seen) {
          prompt.textContent = 'tap to open';
          prompt.classList.add('detected');
        } else {
          prompt.textContent = 'point at the tiles';
          prompt.classList.remove('detected');
        }
      }
    }

    // Start camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, audio: false
        });
        video.srcObject = stream;
        video.addEventListener('playing', () => {
          video.classList.add('ready');
          scrim.classList.add('dim');
          setInterval(checkFrame, 400);
        });
      } catch (e) {
        document.getElementById('nocamera').style.display = 'block';
      }
    }

    function pickGif() {
      let idx;
      do { idx = Math.floor(Math.random() * gifs.length); } while (idx === last && gifs.length > 1);
      last = idx;
      return gifs[idx];
    }

    function openGif() {
      const g = pickGif();
      gifImg.src = '';
      gifImg.src = g.src;
      gifName.textContent = g.name;
      gifWrap.classList.add('visible');
      prompt.classList.add('hidden');
      overlayOpen = true;
    }

    function closeGif() {
      gifWrap.classList.remove('visible');
      prompt.classList.remove('hidden');
      overlayOpen = false;
    }

    document.body.addEventListener('click', () => {
      if (overlayOpen) {
        closeGif();
      } else if (tilesDetected) {
        openGif();
      }
    });

    startCamera();
  </script>

</body>
</html>
