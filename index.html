<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Time and Light</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: black;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    /* Live camera feed fills the screen */
    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
    }
    #camera.ready { opacity: 1; }

    /* Dark scrim — lightens once camera is ready */
    #scrim {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.55);
      transition: background 1s ease;
      z-index: 1;
    }
    #scrim.dim { background: rgba(5, 8, 15, 0.25); }

    /* Tap prompt */
    #prompt {
      position: fixed;
      bottom: 2.5rem;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      z-index: 10;
      transition: color 0.6s, opacity 0.5s;
      color: rgba(255,255,255,0.25);
    }
    #prompt.detected { color: rgba(255,255,255,0.7); }
    #prompt.hidden { opacity: 0; pointer-events: none; }

    /* GIF overlay */
    #gif-wrap {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 8, 15, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #gif-wrap.visible {
      opacity: 1;
      pointer-events: all;
    }

    #gif-img {
      max-width: 88vw;
      max-height: 78vh;
      display: block;
      border-radius: 2px;
    }

    #gif-name {
      margin-top: 0.9rem;
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: lowercase;
    }

    #gif-dismiss {
      margin-top: 1.5rem;
      color: rgba(255,255,255,0.25);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
    }

    /* No-camera fallback */
    #nocamera {
      display: none;
      position: fixed;
      inset: 0;
      background: #05080f;
      z-index: 2;
    }
  </style>
</head>
<body>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="sample" style="display:none" width="64" height="64"></canvas>
  <div id="scrim"></div>
  <div id="prompt">point at the tiles</div>

  <div id="gif-wrap">
    <img id="gif-img" src="" alt="">
    <div id="gif-name"></div>
    <div id="gif-dismiss">tap to close</div>
  </div>

  <div id="nocamera"></div>

  <script>
    const gifs = [
      { name: 'Alice',   src: 'alice.gif' },
      { name: 'Gail',    src: 'gail_1.gif' },
      { name: 'Gail',    src: 'gail_2.gif' },
      { name: 'Maureen', src: 'maureen_1.gif' },
      { name: 'Maureen', src: 'maureen_2.gif' },
      { name: 'Emily',   src: 'emily_1.gif' },
      { name: 'Emily',   src: 'emily_2.gif' },
      { name: 'Emily',   src: 'emily_3.gif' },
      { name: 'Johanna', src: 'johanna_1.gif' },
      { name: 'Johanna', src: 'johanna_2.gif' },
      { name: 'Johanna', src: 'johanna_3.gif' },
    ];

    const video    = document.getElementById('camera');
    const scrim    = document.getElementById('scrim');
    const prompt   = document.getElementById('prompt');
    const gifWrap  = document.getElementById('gif-wrap');
    const gifImg   = document.getElementById('gif-img');
    const gifName  = document.getElementById('gif-name');

    const canvas  = document.getElementById('sample');
    const ctx     = canvas.getContext('2d', { willReadFrequently: true });

    let last = -1;
    let overlayOpen = false;
    let tilesDetected = false;

    // Detect cyanotype blue + periodic square tile grid (evenly-spaced grout lines)
    function detectTiles() {
      if (!video.videoWidth) return false;
      ctx.drawImage(video, 0, 0, 64, 64);
      const data = ctx.getImageData(0, 0, 64, 64).data;

      let cyanCount = 0;
      const gray = new Uint8Array(64 * 64);
      for (let i = 0; i < 64 * 64; i++) {
        const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
        if (b > r + 20 && b > g + 12 && b > 70 && b < 200 && r < 160) cyanCount++;
        gray[i] = Math.round(0.299*r + 0.587*g + 0.114*b);
      }
      if (cyanCount / (64*64) < 0.20) return false; // need 20%+ cyanotype blue

      // Compute row and column brightness averages
      const row = new Float32Array(64), col = new Float32Array(64);
      for (let y = 0; y < 64; y++)
        for (let x = 0; x < 64; x++) { row[y] += gray[y*64+x]; col[x] += gray[y*64+x]; }
      for (let i = 0; i < 64; i++) { row[i] /= 64; col[i] /= 64; }

      // Find local minima (grout lines = darker bands)
      function minima(arr) {
        const m = [];
        for (let i = 2; i < 62; i++)
          if (arr[i] < arr[i-1] && arr[i] < arr[i+1] && arr[i] < arr[i-2] && arr[i] < arr[i+2])
            m.push(i);
        return m;
      }

      // Check minima are evenly spaced (periodic grid, 5–25px apart = 3–12 tiles visible)
      function isRegular(m) {
        if (m.length < 2) return false;
        const gaps = m.slice(1).map((v,i) => v - m[i]);
        const avg = gaps.reduce((a,b)=>a+b,0) / gaps.length;
        if (avg < 5 || avg > 25) return false;
        const std = Math.sqrt(gaps.reduce((a,b)=>a+Math.pow(b-avg,2),0)/gaps.length);
        return std < avg * 0.35; // gaps consistent within 35%
      }

      return isRegular(minima(row)) && isRegular(minima(col));
    }

    function checkFrame() {
      if (overlayOpen) return;
      const seen = detectTiles();
      if (seen !== tilesDetected) {
        tilesDetected = seen;
        if (seen) {
          prompt.textContent = 'tap to open';
          prompt.classList.add('detected');
        } else {
          prompt.textContent = 'point at the tiles';
          prompt.classList.remove('detected');
        }
      }
    }

    // Start camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, audio: false
        });
        video.srcObject = stream;
        video.addEventListener('playing', () => {
          video.classList.add('ready');
          scrim.classList.add('dim');
          setInterval(checkFrame, 400);
        });
      } catch (e) {
        document.getElementById('nocamera').style.display = 'block';
      }
    }

    function pickGif() {
      let idx;
      do { idx = Math.floor(Math.random() * gifs.length); } while (idx === last && gifs.length > 1);
      last = idx;
      return gifs[idx];
    }

    function openGif() {
      const g = pickGif();
      gifImg.src = '';
      gifImg.src = g.src;
      gifName.textContent = g.name;
      gifWrap.classList.add('visible');
      prompt.classList.add('hidden');
      overlayOpen = true;
    }

    function closeGif() {
      gifWrap.classList.remove('visible');
      prompt.classList.remove('hidden');
      overlayOpen = false;
    }

    document.body.addEventListener('click', () => {
      if (overlayOpen) {
        closeGif();
      } else if (tilesDetected) {
        openGif();
      }
    });

    startCamera();
  </script>

</body>
</html>
